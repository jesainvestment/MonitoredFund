```
<h2>Fund Monitoring Dashboard</h2>


<div id="stats">
    Loading...
</div>


<!--
    Show / Hide Columns 3 & 4
-->

<button
    id="toggleColumns"
    onclick="toggleColumns()">

    Show High / Low

</button>


<div class="table-wrap">

    <table id="fundTable">

        <thead></thead>

        <tbody></tbody>

    </table>

</div>



<script>


    /* ==========================================
       COLUMN 3 & 4 VISIBILITY
       ========================================== */

    let columnsVisible = false;


    function toggleColumns() {

        columnsVisible = !columnsVisible;


        const table =
            document.getElementById(
                "fundTable"
            );


        const button =
            document.getElementById(
                "toggleColumns"
            );


        /*
         * Column 3 = index 2
         * Column 4 = index 3
         */

        const cells =
            table.querySelectorAll(
                "th:nth-child(3), td:nth-child(3), " +
                "th:nth-child(4), td:nth-child(4)"
            );


        cells.forEach(cell => {

            if (columnsVisible) {

                cell.classList.remove(
                    "hidden-column"
                );

            } else {

                cell.classList.add(
                    "hidden-column"
                );

            }

        });


        if (columnsVisible) {

            button.textContent =
                "Hide High / Low";

        } else {

            button.textContent =
                "Show High / Low";

        }


        setTimeout(
            lockFirstColumns,
            50
        );

    }



    /* ==========================================
       FORMAT FUND NAME
       ========================================== */

    /*
     * Only the final
     *
     * ( ... )
     *
     * section is bold dark blue.
     */

    function formatFundName(value) {

        const match =
            value.match(
                /^(.*)\(([^()]*)\)\s*$/
            );


        if (!match) {

            return value;

        }


        const normalText =
            match[1];


        const bracketText =
            "(" + match[2] + ")";


        const fragment =
            document.createDocumentFragment();


        /*
         * Normal fund name
         */

        const normalSpan =
            document.createElement(
                "span"
            );


        normalSpan.textContent =
            normalText;


        /*
         * Final bracket text
         */

        const boldSpan =
            document.createElement(
                "span"
            );


        boldSpan.className =
            "fund-bracket";


        boldSpan.textContent =
            bracketText;


        fragment.appendChild(
            normalSpan
        );


        fragment.appendChild(
            boldSpan
        );


        return fragment;

    }



    /* ==========================================
       LOAD CSV
       ========================================== */

    async function loadCSV() {

        const stats =
            document.getElementById(
                "stats"
            );


        try {

            const response =
                await fetch(
                    "MonitoredFund.csv?v=" +
                    Date.now()
                );


            if (!response.ok) {

                throw new Error(
                    "CSV file not found. HTTP " +
                    response.status
                );

            }


            const text =
                await response.text();


            if (!text.trim()) {

                throw new Error(
                    "CSV file is empty"
                );

            }


            /*
             * Convert CSV into rows
             */

            const rows =
                text
                    .trim()
                    .split(/\r?\n/)
                    .map(line =>
                        line.split(",")
                    );


            const head =
                rows[0];


            const data =
                rows.slice(1);


            let up = 0;

            let down = 0;

            let same = 0;

            let nodata = 0;


            const table =
                document.getElementById(
                    "fundTable"
                );


            table.innerHTML = "";


            /* =================================
               HEADER
               ================================= */

            const thead =
                table.createTHead();


            const headerRow =
                thead.insertRow();


            head.forEach(
                (header, index) => {

                    const th =
                        document.createElement(
                            "th"
                        );


                    /*
                     * Rename Sequence
                     * to Seq.
                     */

                    if (
                        index === 0 &&
                        header.trim()
                            .toLowerCase() ===
                            "sequence"
                    ) {

                        th.textContent =
                            "Seq.";

                    } else {

                        th.textContent =
                            header.trim();

                    }


                    /*
                     * Hide Columns 3 & 4
                     */

                    if (
                        index === 2 ||
                        index === 3
                    ) {

                        th.classList.add(
                            "hidden-column"
                        );

                    }


                    /*
                     * Highlight latest
                     * collected date
                     */

                    if (
                        index ===
                        head.length - 1
                    ) {

                        th.classList.add(
                            "latest"
                        );

                    }


                    headerRow.appendChild(
                        th
                    );

                }
            );



            /* =================================
               DATA
               ================================= */

            const tbody =
                table.createTBody();


            data.forEach(row => {

                if (row.length === 0) {

                    return;

                }


                const tr =
                    tbody.insertRow();


                let previous = null;


                let trend = "➡";


                /*
                 * =================================
                 * MAX / MIN
                 *
                 * START FROM COLUMN 5
                 *
                 * Column 5 = index 4
                 *
                 * Continue through the latest
                 * collected date.
                 * =================================
                 */

                let maxValue = null;

                let minValue = null;



                for (
                    let i = 0;
                    i < head.length;
                    i++
                ) {

                    const td =
                        tr.insertCell();


                    const value =
                        (row[i] || "")
                            .trim();


                    /*
                     * Hide Columns 3 & 4
                     */

                    if (
                        i === 2 ||
                        i === 3
                    ) {

                        td.classList.add(
                            "hidden-column"
                        );

                    }


                    /* =========================
                       COLUMN 2 - FUND
                       ========================= */

                    if (i === 1) {

                        const formatted =
                            formatFundName(
                                value
                            );


                        if (
                            typeof formatted ===
                            "string"
                        ) {

                            td.textContent =
                                formatted;

                        } else {

                            td.appendChild(
                                formatted
                            );

                        }


                        continue;

                    }


                    /* =========================
                       FIRST FOUR COLUMNS
                       ========================= */

                    if (i < 4) {

                        td.textContent =
                            value;


                        continue;

                    }


                    /* =========================
                       NO DATA
                       ========================= */

                    if (value === "") {

                        td.textContent =
                            "";

                        nodata++;

                        continue;

                    }


                    if (value === "-") {

                        td.textContent =
                            "-";

                        nodata++;

                        continue;

                    }


                    const number =
                        parseFloat(
                            value
                        );


                    if (isNaN(number)) {

                        td.textContent =
                            value;

                        continue;

                    }


                    /* =========================
                       MAX / MIN CALCULATION
                       ========================= */

                    if (
                        maxValue === null ||
                        number > maxValue
                    ) {

                        maxValue =
                            number;

                    }


                    if (
                        minValue === null ||
                        number < minValue
                    ) {

                        minValue =
                            number;

                    }


                    /* =========================
                       PRICE COMPARISON
                       ========================= */

                    if (
                        previous === null
                    ) {

                        td.textContent =
                            "■ " +
                            number.toFixed(4);


                        td.className =
                            "same";


                        same++;

                    } else if (
                        number > previous
                    ) {

                        td.textContent =
                            "▲ " +
                            number.toFixed(4);


                        td.className =
                            "up";


                        up++;


                        trend =
                            "📈";

                    } else if (
                        number < previous
                    ) {

                        td.textContent =
                            "▼ " +
                            number.toFixed(4);


                        td.className =
                            "down";


                        down++;


                        trend =
                            "📉";

                    } else {

                        td.textContent =
                            "■ " +
                            number.toFixed(4);


                        td.className =
                            "same";


                        same++;

                    }


                    previous =
                        number;

                }



                /* =================================
                   TREND COLUMN
                   ================================= */

                const trendCell =
                    tr.insertCell();


                trendCell.textContent =
                    trend;



                /* =================================
                   MAX / MIN COLUMN
                   ================================= */

                const maxMinCell =
                    tr.insertCell();


                maxMinCell.className =
                    "max-min";


                if (
                    maxValue !== null &&
                    minValue !== null
                ) {


                    /*
                     * MAX
                     *
                     * ▲ Arrow
                     * Dark Green
                     */

                    const maxLine =
                        document.createElement(
                            "div"
                        );


                    const maxText =
                        document.createElement(
                            "span"
                        );


                    maxText.className =
                        "max-value";


                    maxText.textContent =
                        "▲ " +
                        maxValue.toFixed(4);


                    maxLine.appendChild(
                        maxText
                    );


                    /*
                     * MIN
                     *
                     * ▼ Arrow
                     * Red
                     */

                    const minLine =
                        document.createElement(
                            "div"
                        );


                    const minText =
                        document.createElement(
                            "span"
                        );


                    minText.className =
                        "min-value";


                    minText.textContent =
                        "▼ " +
                        minValue.toFixed(4);


                    minLine.appendChild(
                        minText
                    );


                    /*
                     * Add both lines
                     */

                    maxMinCell.appendChild(
                        maxLine
                    );


                    maxMinCell.appendChild(
                        minLine
                    );


                } else {

                    maxMinCell.textContent =
                        "-";

                }

            });



            /* =================================
               TREND HEADER
               ================================= */

            const trendHeader =
                document.createElement(
                    "th"
                );


            trendHeader.textContent =
                "Trend";


            headerRow.appendChild(
                trendHeader
            );



            /* =================================
               MAX / MIN HEADER
               ================================= */

            const maxMinHeader =
                document.createElement(
                    "th"
                );


            maxMinHeader.textContent =
                "Max / Min";


            headerRow.appendChild(
                maxMinHeader
            );



            /* =================================
               STATISTICS
               ================================= */

            stats.innerHTML =
                `Total Funds: ${data.length}
                &nbsp;&nbsp; 🟢 Up: ${up}
                &nbsp;&nbsp; 🔴 Down: ${down}
                &nbsp;&nbsp; ⚪ Same: ${same}
                &nbsp;&nbsp; ⚫ No Data: ${nodata}`;



            /* =================================
               LOCK COLUMNS AND SCROLL RIGHT
               ================================= */

            setTimeout(() => {

                /*
                 * Lock first columns
                 */

                lockFirstColumns();


                /*
                 * Automatically scroll
                 * table-wrap to the right
                 *
                 * This shows the latest
                 * collected date when the
                 * webpage opens.
                 */

                const tableWrap =
                    document.querySelector(
                        ".table-wrap"
                    );


                if (tableWrap) {

                    tableWrap.scrollLeft =
                        tableWrap.scrollWidth;

                }

            }, 200);


        } catch (error) {

            console.error(error);


            stats.innerHTML =
                "❌ ERROR: " +
                error.message;

        }

    }



    /* ==========================================
       LOCK FIRST COLUMNS
       ========================================== */

    function lockFirstColumns() {

        const table =
            document.getElementById(
                "fundTable"
            );


        let left = 0;


        /*
         * Hidden:
         * Columns 1 & 2 sticky.
         *
         * Visible:
         * Columns 1–4 sticky.
         */

        const numberOfColumns =
            columnsVisible ? 4 : 2;


        for (
            let column = 0;
            column < numberOfColumns;
            column++
        ) {

            const cells =
                table.querySelectorAll(
                    `th:nth-child(${column + 1}),
                     td:nth-child(${column + 1})`
                );


            if (!cells.length) {

                continue;

            }


            /*
             * Find first visible cell
             */

            const firstVisibleCell =
                Array.from(cells).find(
                    cell =>
                        !cell.classList.contains(
                            "hidden-column"
                        )
                );


            if (!firstVisibleCell) {

                continue;

            }


            const width =
                firstVisibleCell
                    .getBoundingClientRect()
                    .width;


            cells.forEach(cell => {

                cell.style.position =
                    "sticky";


                cell.style.left =
                    left + "px";


                if (
                    cell.tagName === "TH"
                ) {

                    cell.style.top =
                        "0";


                    cell.style.zIndex =
                        "20";


                    cell.style.background =
                        "#e6e6e6";

                } else {

                    cell.style.zIndex =
                        "10";


                    cell.style.background =
                        "#fff";

                }

            });


            left += width;

        }

    }



    /* ==========================================
       LOAD CSV
       ========================================== */

    loadCSV();


</script>
